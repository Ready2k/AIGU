AWSTemplateFormatVersion: '2010-09-09'
Description: AIGU Logic Layer (Brain) - LangGraph Lambda and Bedrock Access
Parameters:
  LangFuseSecretKey:
    Type: String
    NoEcho: true
    Description: LangFuse Secret Key
  LangFusePublicKey:
    Type: String
    Description: LangFuse Public Key
  LangFuseHost:
    Type: String
    Description: LangFuse Host URL (e.g. cloud.langfuse.com)
  NovaModelId:
    Type: String
    Default: "amazon.nova-pro-v1:0"
    Description: Default Amazon Nova Model ID

Resources:
  # 1. IAM Role for LangGraph Execution
  LangGraphExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AIGU-PersistenceAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource:
                  - !Sub 
                    - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}'
                    - TableName: !ImportValue AIGU-GlobalStateTableName
                  - !Sub 
                    - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}'
                    - TableName: !ImportValue AIGU-SystemConfigTableName
                  - !Sub 
                    - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}'
                    - TableName: !ImportValue AIGU-CheckpointsTableName
                  - !Sub 
                    - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}'
                    - TableName: !ImportValue AIGU-WritesTableName
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: 
                  - !Sub 
                    - 'arn:aws:s3:::${BucketName}/*'
                    - BucketName: !ImportValue AIGU-ArtifactBucketName
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub 
                    - 'arn:aws:s3:::${BucketName}'
                    - BucketName: !ImportValue AIGU-ArtifactBucketName
        - PolicyName: AIGU-BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - bedrock:InvokeModel
                Resource:
                  - arn:aws:bedrock:*::foundation-model/amazon.nova-*
              - Effect: Allow
                Action: 
                  - bedrock:ListFoundationModels
                Resource: "*"
        - PolicyName: AIGU-SESAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
        - PolicyName: AIGU-CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*:*:*'

  # 2. Lambda Function (The Brain Container)
  LangGraphEngineFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: AIGU-LangGraph-Engine
      Runtime: python3.12
      Handler: aigu.handler.lambda_handler
      Role: !GetAtt LangGraphExecutionRole.Arn
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !ImportValue AIGU-GlobalStateTableName
          CONFIG_TABLE_NAME: !ImportValue AIGU-SystemConfigTableName
          ARTIFACT_BUCKET: !ImportValue AIGU-ArtifactBucketName
          CHECKPOINTS_TABLE_NAME: !ImportValue AIGU-CheckpointsTableName
          WRITES_TABLE_NAME: !ImportValue AIGU-WritesTableName
          NOTIFY_EMAIL_SENDER: "governance@aigu.io"
          LANGFUSE_SECRET_KEY: !Ref LangFuseSecretKey
          LANGFUSE_PUBLIC_KEY: !Ref LangFusePublicKey
          LANGFUSE_HOST: !Ref LangFuseHost
          NOVA_MODEL_ID: !Ref NovaModelId
      Code: ../../build_logic

Outputs:
  LangGraphFunctionArn:
    Value: !GetAtt LangGraphEngineFunction.Arn
    Export:
      Name: AIGU-LangGraphFunctionArn
