AWSTemplateFormatVersion: '2010-09-09'
Description: AIGU Logic Layer (Brain) - LangGraph Lambda and Bedrock Access
Parameters:
  LangFuseSecretKey:
    Type: String
    NoEcho: true
    Description: LangFuse Secret Key
  LangFusePublicKey:
    Type: String
    Description: LangFuse Public Key
  LangFuseHost:
    Type: String
    Description: LangFuse Host URL (e.g. cloud.langfuse.com)
  NovaModelId:
    Type: String
    Default: amazon.nova-pro-v1:0
    Description: Default Amazon Nova Model ID
Resources:
  LangGraphExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: AIGU-PersistenceAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:BatchWriteItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            Resource:
            - Fn::Sub:
              - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
              - TableName:
                  Fn::ImportValue: AIGU-GlobalStateTableName
            - Fn::Sub:
              - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
              - TableName:
                  Fn::ImportValue: AIGU-SystemConfigTableName
            - Fn::Sub:
              - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
              - TableName:
                  Fn::ImportValue: AIGU-CheckpointsTableName
            - Fn::Sub:
              - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
              - TableName:
                  Fn::ImportValue: AIGU-WritesTableName
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            Resource:
            - Fn::Sub:
              - arn:aws:s3:::${BucketName}/*
              - BucketName:
                  Fn::ImportValue: AIGU-ArtifactBucketName
          - Effect: Allow
            Action:
            - s3:ListBucket
            Resource:
            - Fn::Sub:
              - arn:aws:s3:::${BucketName}
              - BucketName:
                  Fn::ImportValue: AIGU-ArtifactBucketName
      - PolicyName: AIGU-BedrockAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - bedrock:InvokeModel
            Resource:
            - arn:aws:bedrock:*::foundation-model/amazon.nova-*
          - Effect: Allow
            Action:
            - bedrock:ListFoundationModels
            Resource: '*'
      - PolicyName: AIGU-SESAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ses:SendEmail
            - ses:SendRawEmail
            Resource: '*'
      - PolicyName: AIGU-CloudWatchLogs
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*:*:*
  LangGraphEngineFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: AIGU-LangGraph-Engine
      Runtime: python3.12
      Handler: aigu.handler.lambda_handler
      Role:
        Fn::GetAtt:
        - LangGraphExecutionRole
        - Arn
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME:
            Fn::ImportValue: AIGU-GlobalStateTableName
          CONFIG_TABLE_NAME:
            Fn::ImportValue: AIGU-SystemConfigTableName
          ARTIFACT_BUCKET:
            Fn::ImportValue: AIGU-ArtifactBucketName
          CHECKPOINTS_TABLE_NAME:
            Fn::ImportValue: AIGU-CheckpointsTableName
          WRITES_TABLE_NAME:
            Fn::ImportValue: AIGU-WritesTableName
          NOTIFY_EMAIL_SENDER: governance@aigu.io
          LANGFUSE_SECRET_KEY:
            Ref: LangFuseSecretKey
          LANGFUSE_PUBLIC_KEY:
            Ref: LangFusePublicKey
          LANGFUSE_HOST:
            Ref: LangFuseHost
          NOVA_MODEL_ID:
            Ref: NovaModelId
      Code:
        S3Bucket: aigu-deployment-artifacts-388660028061
        S3Key: d3019a3bf98fec5fa7930fce49de367a
Outputs:
  LangGraphFunctionArn:
    Value:
      Fn::GetAtt:
      - LangGraphEngineFunction
      - Arn
    Export:
      Name: AIGU-LangGraphFunctionArn
