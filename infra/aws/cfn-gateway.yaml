AWSTemplateFormatVersion: '2010-09-09'
Description: AIGU Gateway Layer (Nerves) - API Gateway and SES

Resources:
  # 1. API Gateway (REST API)
  AIGUApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: AIGU-Governance-API
      Description: API for AIGU Frontend to talk to the LangGraph Brain
      EndpointConfiguration:
        Types:
          - REGIONAL

  # 2. Resources & Methods (Proxy to Lambda using ANY)
  InvokeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ParentId: !GetAtt AIGUApiGateway.RootResourceId
      PathPart: invoke

  InvokeMethodIAM:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref InvokeResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  InvokeOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref InvokeResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  StateResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ParentId: !GetAtt AIGUApiGateway.RootResourceId
      PathPart: state

  StateMethodIAM:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref StateResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  StateOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref StateResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  # 3. Permissions (Gateway -> Lambda)
  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue AIGU-LangGraphFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AIGUApiGateway}/*/*/*'

  # 4. Deployment (New Logical ID V5 to force redeploy)
  AIGUApiDeploymentV5:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [InvokeMethodIAM, InvokeOptionsMethod, StateMethodIAM, StateOptionsMethod]
    Properties:
      RestApiId: !Ref AIGUApiGateway
      Description: Re-enable IAM Auth with explicit methods and OPTIONS fallback

  AIGUApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: v1
      RestApiId: !Ref AIGUApiGateway
      DeploymentId: !Ref AIGUApiDeploymentV5

Outputs:
  ApiEndpoint:
    Value: !Sub 'https://${AIGUApiGateway}.execute-api.${AWS::Region}.amazonaws.com/v1'
    Export:
      Name: AIGU-ApiEndpoint
