AWSTemplateFormatVersion: '2010-09-09'
Description: AIGU Gateway Layer (Nerves) - API Gateway and SES

Resources:
  # 1. API Gateway (REST API)
  AIGUApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: AIGU-Governance-API
      Description: API for AIGU Frontend to talk to the LangGraph Brain
      EndpointConfiguration:
        Types:
          - REGIONAL

  # 2. Resources & Methods (Proxy to Lambda using ANY)
  InvokeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ParentId: !GetAtt AIGUApiGateway.RootResourceId
      PathPart: invoke

  InvokeMethodIAM:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref InvokeResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  InvokeOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref InvokeResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  StateResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ParentId: !GetAtt AIGUApiGateway.RootResourceId
      PathPart: state

  StateMethodIAM:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref StateResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  StateOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref StateResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  StatePostMethodIAM:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref StateResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  StateDeleteMethodIAM:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref StateResource
      HttpMethod: DELETE
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  # Upload Resource
  UploadResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ParentId: !GetAtt AIGUApiGateway.RootResourceId
      PathPart: upload

  UploadMethodIAM:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref UploadResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  UploadOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref UploadResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  # Files Resource
  FilesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ParentId: !GetAtt AIGUApiGateway.RootResourceId
      PathPart: files

  FilesMethodIAM:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref FilesResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  FilesOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref FilesResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  # Support Resource
  SupportResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ParentId: !GetAtt AIGUApiGateway.RootResourceId
      PathPart: support

  SupportAskResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ParentId: !Ref SupportResource
      PathPart: ask

  SupportAskMethodIAM:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref SupportAskResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  SupportAskOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref SupportAskResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  AdminResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ParentId: !GetAtt AIGUApiGateway.RootResourceId
      PathPart: admin

  AdminListResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ParentId: !Ref AdminResource
      PathPart: list

  AdminListMethodIAM:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref AdminListResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  AdminListOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref AdminListResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  ConfigResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ParentId: !GetAtt AIGUApiGateway.RootResourceId
      PathPart: config

  ConfigMethodIAM:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref ConfigResource
      HttpMethod: ANY
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  ConfigOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref ConfigResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  ModelsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ParentId: !GetAtt AIGUApiGateway.RootResourceId
      PathPart: models

  ModelsMethodIAM:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref ModelsResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  ModelsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref ModelsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  DeltaResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ParentId: !GetAtt AIGUApiGateway.RootResourceId
      PathPart: delta

  DeltaMethodIAM:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref DeltaResource
      HttpMethod: ANY
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  DeltaOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref DeltaResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  SessionsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ParentId: !GetAtt AIGUApiGateway.RootResourceId
      PathPart: sessions

  SessionsMethodIAM:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref SessionsResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  SessionsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AIGUApiGateway
      ResourceId: !Ref SessionsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: !ImportValue AIGU-LangGraphFunctionArn

  # 3. Gateway Responses (Enable CORS for IAM Rejection)
  GatewayResponse4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref AIGUApiGateway

  GatewayResponse5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref AIGUApiGateway

  # 4. Permissions (Gateway -> Lambda)
  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue AIGU-LangGraphFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AIGUApiGateway}/*/*/*'


  # 5. Deployment (New Logical ID V10 to force redeploy with new endpoints)
  AIGUApiDeploymentV10:
    Type: AWS::ApiGateway::Deployment
    DependsOn: 
      - InvokeMethodIAM
      - InvokeOptionsMethod
      - StateMethodIAM
      - StateOptionsMethod
      - StatePostMethodIAM
      - StateDeleteMethodIAM
      - UploadMethodIAM
      - UploadOptionsMethod
      - FilesMethodIAM
      - FilesOptionsMethod
      - SupportAskMethodIAM
      - SupportAskOptionsMethod
      - AdminListMethodIAM
      - AdminListOptionsMethod
      - ConfigMethodIAM
      - ConfigOptionsMethod
      - ModelsMethodIAM
      - ModelsOptionsMethod
      - DeltaMethodIAM
      - DeltaOptionsMethod
      - SessionsMethodIAM
      - SessionsOptionsMethod
      - GatewayResponse4XX
      - GatewayResponse5XX
    Properties:
      RestApiId: !Ref AIGUApiGateway
      Description: Add upload, files, support/ask endpoints with DELETE /state

  AIGUApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: v1
      RestApiId: !Ref AIGUApiGateway
      DeploymentId: !Ref AIGUApiDeploymentV10

Outputs:
  ApiEndpoint:
    Value: !Sub 'https://${AIGUApiGateway}.execute-api.${AWS::Region}.amazonaws.com/v1'
    Export:
      Name: AIGU-ApiEndpoint
