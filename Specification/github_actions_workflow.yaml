# .github/workflows/aigu_tdd.yml
name: AIGU TDD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write # Required for requesting the JWT for AWS OIDC
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio moto # Moto for mocking AWS

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1 # Region for Amazon Bedrock

      - name: Run TDD Scenarios
        env:
          DYNAMODB_TABLE: AIGU_Global_State
          MODEL_ID: amazon.nova-pro-v1:0
        run: |
          # Executes the scenarios defined in Testing/TEST_SCENARIOS.md
          pytest tests/ --audit-check=required 

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: tdd-report
          path: htmlcov/